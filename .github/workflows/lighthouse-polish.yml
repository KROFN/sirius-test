name: Lighthouse polish patch

on:
  push:
    branches:
      - perf/accessibility-polish
    paths:
      - .github/workflows/lighthouse-polish.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run Lighthouse polish patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/accessibility-polish

      - name: Apply targeted Lighthouse fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          old_font = '  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet" />'
          new_font = '''  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" />\n  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />\n  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" /></noscript>'''
          if html.count(old_font) != 1:
              raise SystemExit(f'Expected one Google Fonts stylesheet tag, found {html.count(old_font)}')
          html = html.replace(old_font, new_font, 1)
          index.write_text(html, encoding='utf-8')

          css_path = Path('styles.css')
          css = css_path.read_text(encoding='utf-8')
          replacements = [
              ('color: rgba(16,16,16,.58);\n}\n.offer-path__price + .offer-path__media', 'color: rgba(16,16,16,.62);\n}\n.offer-path__price + .offer-path__media'),
              ('.spec-list dt { font-size: 11px; line-height: 1.25; font-weight: 700; letter-spacing: .035em; color: rgba(16,16,16,.58); }', '.spec-list dt { font-size: 11px; line-height: 1.25; font-weight: 700; letter-spacing: .035em; color: rgba(16,16,16,.62); }'),
              ('.booking-flow span { grid-row: 1 / 3; font-size: 11px; line-height: 1.3; font-weight: 700; color: var(--red); font-variant-numeric: tabular-nums; }', '.booking-flow span { grid-row: 1 / 3; font-size: 11px; line-height: 1.3; font-weight: 700; color: #D33A2A; font-variant-numeric: tabular-nums; }'),
              ('  color: rgba(16,16,16,.78);\n  font-weight: 600 !important;\n}', '  color: rgba(16,16,16,.84);\n  font-weight: 600 !important;\n}')
          ]
          for old, new in replacements:
              count = css.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one CSS target, found {count}: {old[:70]!r}')
              css = css.replace(old, new, 1)
          css_path.write_text(css, encoding='utf-8')
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/lighthouse-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css .github/workflows/lighthouse-polish.yml
          git commit -m "Polish Lighthouse accessibility and font loading"
          git push origin HEAD:perf/accessibility-polish
