name: Demo hygiene one-shot

on:
  push:
    branches:
      - chore/demo-hygiene-final

permissions:
  contents: write

jobs:
  hygiene:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/demo-hygiene-final

      - name: Clean unofficial demo source
        shell: python
        run: |
          from pathlib import Path
          import re

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')

          index, schema_count = re.subn(
              r'\n\s*<script type="application/ld\+json">.*?</script>\n',
              '\n',
              index,
              count=1,
              flags=re.S,
          )
          if schema_count != 1:
              raise SystemExit(f'Expected one LocalBusiness JSON-LD block, removed {schema_count}')

          index, instagram_count = re.subn(
              r'\n\s*<a href="https://www\.instagram\.com/sirius_ph\.studio/"[^>]*>.*?</a>',
              '',
              index,
              count=1,
              flags=re.S,
          )
          if instagram_count != 1:
              raise SystemExit(f'Expected one Instagram anchor, removed {instagram_count}')

          index_path.write_text(index, encoding='utf-8')

          script_path = Path('script.js')
          script = script_path.read_text(encoding='utf-8')
          script, function_count = re.subn(
              r'\n\s*const removeUnavailableInstagram = \(\) => \{.*?\n\s*\};\n',
              '\n',
              script,
              count=1,
              flags=re.S,
          )
          if function_count != 1:
              raise SystemExit(f'Expected one Instagram cleanup function, removed {function_count}')

          script, call_count = re.subn(
              r'\n\s*removeUnavailableInstagram\(\);',
              '',
              script,
              count=1,
          )
          if call_count != 1:
              raise SystemExit(f'Expected one Instagram cleanup call, removed {call_count}')

          script_path.write_text(script, encoding='utf-8')

          for path in (index_path, script_path):
              text = path.read_text(encoding='utf-8')
              for forbidden in ('instagram.com/sirius_ph.studio', 'removeUnavailableInstagram'):
                  if forbidden in text:
                      raise SystemExit(f'{forbidden} still present in {path}')

          if 'application/ld+json' in index_path.read_text(encoding='utf-8'):
              raise SystemExit('JSON-LD still present in index.html')

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/demo-hygiene-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html script.js .github/workflows/demo-hygiene-once.yml
          git commit -m "Clean demo-only metadata [skip ci]"
          git push origin HEAD:chore/demo-hygiene-final
